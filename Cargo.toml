# 3329lens — cryptographic inventory scanner.
#
# The package is published as `lens3329` because Cargo rejects package names
# starting with a digit; the product, org, domain and binary are all `3329lens`.
[package]
name = "lens3329"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cryptographic inventory scanner: crypto library discovery, lockfile version resolution (Cargo/npm/PyPI), offline advisory/CVE correlation, and CycloneDX CBOM / SARIF export."
authors = ["Adam Gardiner <adam@lomyen.dev>"]
readme = "README.md"
keywords = ["cryptography", "cbom", "sbom", "security", "vulnerability"]
categories = ["cryptography", "development-tools"]
repository = "https://github.com/3329lens/3329lens"
homepage = "https://3329lens.dev"
documentation = "https://docs.rs/lens3329"

[lib]
name = "lens3329"
path = "src/lib.rs"

[[bin]]
name = "3329lens"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The CLI and TUI stack. Library consumers wanting the lean correlation core
# only should depend on this crate with `default-features = false`.
cli = ["dep:clap", "dep:colored", "dep:crossterm", "dep:ratatui"]

[dependencies]
# Core library — no UI, no crypto implementation.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
semver = "1.0"
walkdir = "2"
chrono = "0.4"
# CBOM serial numbers need uniqueness, not cryptographic strength. This is the
# scanner's only randomness dependency. The `std` feature is what implements
# `std::error::Error` for its error type, so `?` works in the CLI.
getrandom = { version = "0.2", features = ["std"] }

# CLI + TUI, gated behind the `cli` feature.
clap = { version = "4.0", features = ["derive"], optional = true }
colored = { version = "2.0", optional = true }
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.26", optional = true }
